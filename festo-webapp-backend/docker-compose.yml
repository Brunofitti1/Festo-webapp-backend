version: '3.8'

services:
  festo-db:
    image: postgres:14-alpine
    container_name: festo-postgres-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - festo_postgres_data:/var/lib/postgresql/data

volumes:
  festo_postgres_data:
